name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Build release binaries
        env:
          COMMIT: ${{ github.sha }}
        run: |
          version=${GITHUB_REF_NAME#v}
          make dist VERSION="$version" COMMIT="$COMMIT"
      - name: Extract changelog release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/release-notes.sh "$version" > /tmp/regru-release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "regru $GITHUB_REF_NAME" \
            --notes-file /tmp/regru-release-notes.md \
            --verify-tag
